<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | BookStore</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <h1>BookStore</h1>
    <p class="muted">Silakan login untuk masuk ke toko buku.</p>
    <form id="loginForm">
      <div><label for="email">Email</label><input type="email" id="email" required placeholder="Masukkan email"></div>
      <div><label for="password">Password</label><input type="password" id="password" required placeholder="Masukkan password"></div>
      <button type="submit">Login</button>
    </form>
    <div class="login-links">
      <button type="button" onclick="openModal('forgotModal')">Lupa Password</button>
      <button type="button" onclick="openModal('registerModal')">Daftar</button>
    </div>
    <p class="muted" style="margin:20px 0 0;font-size:12px">Akun demo: admin@bookstore.com / 123456</p>
  </main>

  <div class="modal" id="forgotModal">
    <section class="modal-content">
      <button class="close" onclick="closeModal('forgotModal')">X</button>
      <h2>Lupa Password</h2>
      <form id="forgotForm">
        <div><label for="forgotEmail">Email terdaftar</label><input id="forgotEmail" type="email" required></div>
        <button type="submit">Kirim</button>
      </form>
    </section>
  </div>
  <div class="modal" id="registerModal">
    <section class="modal-content">
      <button class="close" onclick="closeModal('registerModal')">X</button>
      <h2>Daftar Akun</h2>
      <form id="registerForm">
        <div><label for="regName">Nama</label><input id="regName" required></div>
        <div><label for="regEmail">Email</label><input id="regEmail" type="email" required></div>
        <div><label for="regPassword">Password</label><input id="regPassword" type="password" minlength="6" required></div>
        <button type="submit">Buat Akun</button>
      </form>
    </section>
  </div>
</body>
</html>
